<script>
/* ==========================================================================
   ViewGantt.html — Carta Gantt por proyecto.

   · La escala (semana … año) solo cambia cómo se dibujan las columnas; lo que
     se guarda son fechas, de modo que cambiar de escala nunca altera datos.
   · Posición y tamaño de cada cajita salen de una única función de geometría:
     x = (día - inicioDelRango) * pxPorDía. Arrastrar convierte píxeles a días.
   · Al soltar, la cajita se actualiza de inmediato en pantalla (optimista) y se
     persiste. Si el servidor rechaza el cambio, se vuelve a leer el estado real.
   · Todos los textos de datos pasan por UI.esc().
   ========================================================================== */

var Gantt = { data: null, projectId: null, scale: 'month', geo: null, drag: null, tip: null,
  hidden: {}, pop: null, win: null, winProject: null, rdrag: null, raf: null };

var GT_SCALES = [
  { v: 'day',       label: 'Día',          ppd: 44,  minCols: 14, defLen: 3 },
  { v: 'week',      label: 'Semana',       ppd: 30,  minCols: 8, defLen: 4 },
  { v: 'month',     label: 'Mes',          ppd: 7,   minCols: 6, defLen: 14 },
  { v: 'quarter',   label: 'Trimestre',    ppd: 2.4, minCols: 4, defLen: 30 },
  { v: 'fourmonth', label: 'Cuatrimestre', ppd: 1.8, minCols: 3, defLen: 40 },
  { v: 'semester',  label: 'Semestre',     ppd: 1.2, minCols: 3, defLen: 60 },
  { v: 'year',      label: 'Año',          ppd: 0.6, minCols: 3, defLen: 90 }
];
var GT_MONTHS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
var GT_WEEKDAYS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
var GT_MONTHS_LONG = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto',
  'septiembre', 'octubre', 'noviembre', 'diciembre'];
var GT_MONTHS_PER = { month: 1, quarter: 3, fourmonth: 4, semester: 6, year: 12 };
var GT_GROUP_W = 34, GT_LABEL_W = 176, GT_BAR_H = 30, GT_BAR_GAP = 6, GT_ROW_PAD = 7, GT_MIN_BAR_W = 22;
var GT_COLORS = 6;

/* ───────────────────────────── Fechas (días enteros) ───────────────────── */

function gtPad(n) { return (n < 10 ? '0' : '') + n; }

/** 'YYYY-MM-DD' → nº de días desde 1970-01-01 (UTC, sin deriva horaria). */
function gtDay(iso) {
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
  return m ? Math.round(Date.UTC(+m[1], +m[2] - 1, +m[3]) / 86400000) : null;
}
function gtParts(day) {
  var d = new Date(day * 86400000);
  return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate() };
}
function gtIso(day) {
  var p = gtParts(day);
  return p.y + '-' + gtPad(p.m + 1) + '-' + gtPad(p.d);
}
function gtMonthStart(y, m) { return Math.round(Date.UTC(y, m, 1) / 86400000); }
function gtToday() {
  var n = new Date();
  return gtDay(n.getFullYear() + '-' + gtPad(n.getMonth() + 1) + '-' + gtPad(n.getDate()));
}
function gtShort(day) { var p = gtParts(day); return p.d + ' ' + GT_MONTHS[p.m]; }
function gtLong(iso) { var d = gtDay(iso); if (d === null) return ''; var p = gtParts(d); return p.d + ' ' + GT_MONTHS[p.m] + ' ' + p.y; }

/** Inicio de la unidad (semana lunes-domingo, mes, trimestre…) que contiene `day`. */
function gtUnitStart(scale, day) {
  if (scale === 'day') return day;
  if (scale === 'week') return day - ((((day + 3) % 7) + 7) % 7);   // el 1-ene-1970 fue jueves
  var n = GT_MONTHS_PER[scale];
  var p = gtParts(day);
  return gtMonthStart(p.y, Math.floor(p.m / n) * n);
}
function gtUnitNext(scale, start) {
  if (scale === 'day') return start + 1;
  if (scale === 'week') return start + 7;
  var p = gtParts(start);
  return gtMonthStart(p.y, p.m + GT_MONTHS_PER[scale]);
}
function gtColLabel(scale, start) {
  var p = gtParts(start);
  switch (scale) {
    case 'day': return GT_WEEKDAYS[(((start + 4) % 7) + 7) % 7] + ' ' + p.d;
    case 'week': return p.d + ' ' + GT_MONTHS[p.m];
    case 'month': return GT_MONTHS[p.m];
    case 'quarter': return 'T' + (p.m / 3 + 1);
    case 'fourmonth': return 'C' + (p.m / 4 + 1);
    case 'semester': return 'S' + (p.m / 6 + 1);
    default: return String(p.y);
  }
}
/** Texto de la fila superior (columnas agrupadas). null = escala sin agrupación. */
function gtUpperLabel(scale, start) {
  var p = gtParts(start);
  if (scale === 'week' || scale === 'day') return GT_MONTHS_LONG[p.m] + ' ' + p.y;
  if (scale === 'year') return null;
  return String(p.y);
}

function gtIsWeekend(day) {
  const w = (((day + 4) % 7) + 7) % 7;
  return w === 0 || w === 6;
}

function gtScaleDef(v) {
  return GT_SCALES.filter(function (s) { return s.v === v; })[0] || GT_SCALES[1];
}

/* ───────────────────────────── Geometría ───────────────────────────────── */

/**
 * Rango visible: del inicio de la unidad que contiene la fecha más temprana
 * (actividades y proyecto) hasta una columna más allá de la más tardía, con un
 * mínimo de columnas. La columna extra deja espacio para extender hacia la derecha.
 */
function gtBuildGeo(data, sc, win) {
  var days = [];
  data.items.forEach(function (i) { days.push(gtDay(i.fechaInicio), gtDay(i.fechaFin)); });
  if (data.project) days.push(gtDay(data.project.fechaInicio), gtDay(data.project.fechaFin));
  days = days.filter(function (d) { return d !== null; });
  if (!days.length) days = [gtToday()];
  var min = Math.min.apply(null, days), max = Math.max.apply(null, days);

  // Con una ventana de fechas activa, las columnas cubren solo ese rango.
  if (win) { min = win.from; max = win.to; }

  var cols = [], cur = gtUnitStart(sc.v, min), guard = 0;
  while (guard++ < 3000) {
    var next = gtUnitNext(sc.v, cur);
    cols.push({ start: cur, end: next });
    if (win ? next > max : (cols.length >= sc.minCols && next > max)) break;
    cur = next;
  }
  if (!win) {
    var last = cols[cols.length - 1];
    cols.push({ start: last.end, end: gtUnitNext(sc.v, last.end) });
  }

  var upper = [];
  cols.forEach(function (c) {
    var label = gtUpperLabel(sc.v, c.start);
    var prev = upper[upper.length - 1];
    if (prev && prev.label === label) prev.end = c.end;
    else upper.push({ label: label, start: c.start, end: c.end });
  });

  var rs = cols[0].start, re = cols[cols.length - 1].end;
  return { sc: sc, ppd: sc.ppd, rs: rs, re: re, cols: cols, upper: upper,
    totalW: Math.round((re - rs) * sc.ppd), firstItemDay: win ? rs : Math.min.apply(null, days) };
}

function gtX(geo, day) { return (day - geo.rs) * geo.ppd; }
function gtBarW(geo, d0, d1) { return Math.max((d1 - d0 + 1) * geo.ppd, GT_MIN_BAR_W); }

/** Posición de una cajita recortada al rango visible (puede ser parcial u ocultarse). */
function gtBarGeom(geo, d0, d1) {
  var x0 = gtX(geo, d0), w = gtBarW(geo, d0, d1), clipL = false, clipR = false;
  if (x0 < 0) { w += x0; x0 = 0; clipL = true; }
  if (x0 + w > geo.totalW) { w = geo.totalW - x0; clipR = true; }
  return { left: Math.round(x0), width: Math.round(w), clipL: clipL, clipR: clipR,
    hidden: w <= 0 || x0 >= geo.totalW };
}

function gtApplyBar(bar, geo, d0, d1) {
  var g = gtBarGeom(geo, d0, d1);
  bar.style.left = g.left + 'px';
  bar.style.width = Math.max(0, g.width) + 'px';
  bar.style.display = g.hidden ? 'none' : '';
  bar.classList.toggle('clip-l', g.clipL);
  bar.classList.toggle('clip-r', g.clipR);
}

/* ───────────────────────────── Agrupación en filas ─────────────────────── */

function gtHash(s) {
  var h = 0;
  for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h;
}

/** items (ya ordenados por fila) → [{ name, color, rows:[{ grupo, fila, items, lanes }] }] */
function gtGroups(items) {
  var groups = [], gIdx = {}, rIdx = {};
  items.forEach(function (it) {
    var g = gIdx[it.grupo];
    if (!g) {
      g = { name: it.grupo, color: gtHash(it.grupo) % GT_COLORS, rows: [] };
      gIdx[it.grupo] = g; groups.push(g);
    }
    var key = it.grupo + '\u0001' + it.fila;
    var r = rIdx[key];
    if (!r) { r = { grupo: it.grupo, fila: it.fila, items: [] }; rIdx[key] = r; g.rows.push(r); }
    r.items.push(it);
  });
  groups.forEach(function (g) {
    g.rows.forEach(gtPack);
    // El nombre del grupo se lee en vertical: la banda necesita alto suficiente.
    const need = Math.min(150, g.name.length * 7.5 + 22);
    const have = g.rows.reduce(function (n, r) { return n + r.height; }, 0);
    if (have < need) {
      const extra = Math.ceil((need - have) / g.rows.length);
      g.rows.forEach(function (r) { r.height += extra; r.padTop += extra / 2; });
    }
  });
  return groups;
}

/** Reparte las cajitas de una fila en sublíneas para que no se superpongan. */
function gtPack(row) {
  var ends = [];
  row.items.slice().sort(function (a, b) {
    return String(a.fechaInicio).localeCompare(String(b.fechaInicio));
  }).forEach(function (it) {
    var s = gtDay(it.fechaInicio), e = gtDay(it.fechaFin), lane = 0;
    while (lane < ends.length && s <= ends[lane]) lane++;
    ends[lane] = e;
    it._lane = lane;
  });
  row.lanes = Math.max(1, ends.length);
  row.padTop = GT_ROW_PAD;
  row.height = GT_ROW_PAD * 2 + row.lanes * GT_BAR_H + (row.lanes - 1) * GT_BAR_GAP;
}

/* ───────────────────────────── Vista y carga ───────────────────────────── */

App.registerView('gantt', {
  title: 'Gantt',

  render: function (view, params) {
    const projects = App.state.projects.filter(p => p.activo);
    if (!projects.length) {
      App.setHeader('Gantt', 'Aún no hay proyectos disponibles', '');
      view.innerHTML = UI.empty('&#128197;', 'No hay proyectos activos',
        'Crea un proyecto para planificarlo en una carta Gantt.');
      return;
    }
    const pid = params.projectId || App.state.currentProjectId || projects[0].projectId;
    App.state.currentProjectId = projects.some(p => p.projectId === pid) ? pid : projects[0].projectId;
    Gantt.projectId = App.state.currentProjectId;
    gtCloseFilter();
    gtLoadHidden();
    if (Gantt.winProject !== Gantt.projectId) { Gantt.win = null; Gantt.winProject = Gantt.projectId; }

    try {
      const saved = window.localStorage && localStorage.getItem('kw-gantt-scale');
      if (saved) Gantt.scale = gtScaleDef(saved).v;
    } catch (e) { /* sin almacenamiento: se usa la escala por defecto */ }

    gtHeader();
    view.innerHTML =
      '<p class="gt-hint" id="gt-hint"></p>' +
      '<div id="gt-range"></div>' +
      '<div id="gt-host">' + UI.skeleton(2) + '</div>';
    return gtLoad();
  }
});

function gtRowKey(grupo, fila) { return grupo + '\u0001' + fila; }

function gtHiddenStorageKey() { return 'kw-gantt-hidden-' + Gantt.projectId; }

function gtLoadHidden() {
  Gantt.hidden = {};
  try {
    const raw = window.localStorage && localStorage.getItem(gtHiddenStorageKey());
    if (raw) JSON.parse(raw).forEach(k => { Gantt.hidden[k] = true; });
  } catch (e) { /* sin almacenamiento: todo visible */ }
}

function gtSaveHidden() {
  try {
    if (window.localStorage) localStorage.setItem(gtHiddenStorageKey(), JSON.stringify(Object.keys(Gantt.hidden)));
  } catch (e) { /* noop */ }
}

function gtCanWrite() { return App.can('gantt.write'); }

function gtHeader(subtitle) {
  const projects = App.state.projects.filter(p => p.activo);
  App.setHeader('Gantt', subtitle || '',
    '<select id="gt-project" aria-label="Proyecto" style="min-width:210px;width:auto">' +
      projects.map(p => '<option value="' + UI.esc(p.projectId) + '"' +
        (p.projectId === Gantt.projectId ? ' selected' : '') + '>' + UI.esc(p.nombre) + '</option>').join('') +
    '</select>' +
    '<select id="gt-scale" aria-label="Escala de tiempo" style="width:auto">' +
      GT_SCALES.map(s => '<option value="' + s.v + '"' + (s.v === Gantt.scale ? ' selected' : '') + '>' +
        UI.esc(s.label) + '</option>').join('') +
    '</select>' +
    '<button class="btn" id="gt-filter" aria-haspopup="true">' + UI.esc(gtFilterLabel()) + ' &#9662;</button>' +
    (gtCanWrite() ? '<button class="btn btn-primary" id="gt-new">+ Actividad</button>' : '') +
    '<button class="btn btn-ghost btn-icon" id="gt-refresh" title="Actualizar">&#8635;</button>');

  document.getElementById('gt-project').addEventListener('change', e => {
    App.go('gantt', { projectId: e.target.value });
  });
  document.getElementById('gt-scale').addEventListener('change', e => {
    Gantt.scale = gtScaleDef(e.target.value).v;
    try { if (window.localStorage) localStorage.setItem('kw-gantt-scale', Gantt.scale); } catch (err) { /* noop */ }
    gtRender(true);
  });
  document.getElementById('gt-filter').addEventListener('click', e => {
    if (Gantt.pop) gtCloseFilter(); else gtOpenFilter(e.currentTarget);
  });
  const nw = document.getElementById('gt-new');
  if (nw) nw.addEventListener('click', () => gtOpenModal(null, {}));
  document.getElementById('gt-refresh').addEventListener('click', () => App.refresh());
}

function gtLoad() {
  return App.rpc('getGantt', Gantt.projectId).then(data => {
    Gantt.data = data;
    gtRender(true);
  });
}

/** Filas (grupo, fila) existentes, agrupadas, con su nº de actividades. */
function gtAllRows() {
  return gtGroups(Gantt.data ? Gantt.data.items : []);
}

function gtFilterLabel() {
  const groups = gtAllRows();
  let total = 0, shown = 0;
  groups.forEach(g => g.rows.forEach(r => { total++; if (!Gantt.hidden[gtRowKey(r.grupo, r.fila)]) shown++; }));
  return shown === total ? 'Acciones' : 'Acciones (' + shown + '/' + total + ')';
}

function gtFind(id) {
  return (Gantt.data ? Gantt.data.items : []).filter(i => i.ganttId === id)[0] || null;
}

/* ───────────────────────────── Pintado ─────────────────────────────────── */

/** @param {boolean} scrollToWork Llevar el scroll a la primera actividad. */
function gtRender(scrollToWork) {
  const host = document.getElementById('gt-host');
  if (!host || !Gantt.data) return;

  const data = Gantt.data;
  const hint = document.getElementById('gt-hint');
  if (hint) {
    hint.textContent = gtCanWrite()
      ? 'Arrastra una actividad para moverla (también a otra fila) · tira de sus bordes para cambiar la duración · ' +
        'clic para editar · doble clic en una fila vacía para crear.'
      : 'Vista de solo lectura.';
  }
  gtHeader(data.project.nombre);
  gtRenderRange();
  gtRenderBoard(scrollToWork);
}

/** @param {boolean|string} mode true = ir a la primera actividad; 'left' = al inicio; otro = conservar scroll. */
function gtRenderBoard(mode) {
  const host = document.getElementById('gt-host');
  const data = Gantt.data;
  if (!host || !data) return;

  if (!data.items.length) {
    host.innerHTML = UI.empty('&#128197;', 'Este proyecto aún no tiene actividades',
      gtCanWrite() ? 'Agrega la primera con "+ Actividad".' : 'Todavía no se ha planificado nada.');
    return;
  }

  const prevLeft = host.firstChild && host.firstChild.scrollLeft || 0;
  const prevTop = host.firstChild && host.firstChild.scrollTop || 0;

  const sc = gtScaleDef(Gantt.scale);
  const geo = Gantt.geo = gtBuildGeo(data, sc, Gantt.win ? gtWindow() : null);   // el filtro de acciones no mueve las columnas
  const visible = data.items.filter(i => !Gantt.hidden[gtRowKey(i.grupo, i.fila)]);
  if (!visible.length) {
    host.innerHTML = UI.empty('&#128065;', 'Todas las acciones están ocultas',
      'Usa el filtro "Acciones" para mostrarlas.') +
      '<div style="text-align:center"><button class="btn" id="gt-show-all">Mostrar todas</button></div>';
    document.getElementById('gt-show-all').addEventListener('click', () => { Gantt.hidden = {}; gtSaveHidden(); gtRender(true); });
    return;
  }
  const groups = gtGroups(visible);
  const today = gtToday();
  const LW = GT_GROUP_W + GT_LABEL_W;

  let head = '<div class="gt-head"><div class="gt-corner" style="width:' + LW + 'px">Acciones</div>' +
    '<div class="gt-tl" style="width:' + geo.totalW + 'px">';
  if (geo.upper[0].label !== null) {
    head += '<div class="gt-uprow">' + geo.upper.map(u =>
      '<div class="gt-uc" style="width:' + Math.round((u.end - u.start) * geo.ppd) + 'px">' +
      UI.esc(u.label) + '</div>').join('') + '</div>';
  }
  head += '<div class="gt-lowrow">' + geo.cols.map(c =>
    '<div class="gt-lc' + (today >= c.start && today < c.end ? ' is-today' : '') +
    (sc.v === 'day' && gtIsWeekend(c.start) ? ' is-weekend' : '') +
    '" style="width:' + Math.round((c.end - c.start) * geo.ppd) + 'px">' +
    UI.esc(gtColLabel(sc.v, c.start)) + '</div>').join('') + '</div></div></div>';

  let lines = '<div class="gt-lines" style="left:' + LW + 'px;width:' + geo.totalW + 'px">' +
    (sc.v === 'day' ? geo.cols.filter(c => gtIsWeekend(c.start)).map(c =>
      '<i class="gt-wkend" style="left:' + Math.round(gtX(geo, c.start)) + 'px;width:' + Math.round(geo.ppd) + 'px"></i>').join('') : '') +
    geo.cols.slice(1).map(c => '<i class="gt-vline" style="left:' + Math.round(gtX(geo, c.start)) + 'px"></i>').join('');
  if (today >= geo.rs && today < geo.re) {
    lines += '<i class="gt-today" title="Hoy" style="left:' + Math.round(gtX(geo, today) + geo.ppd / 2) + 'px"></i>';
  }
  lines += '</div>';

  const body = groups.map(g =>
    '<div class="gt-group">' +
      '<div class="gt-gcell gc-' + g.color + '" title="' + UI.esc(g.name) + '"><span>' + UI.esc(g.name) + '</span></div>' +
      '<div class="gt-grows">' + g.rows.map(r => gtRowHtml(r, geo)).join('') + '</div>' +
    '</div>').join('');

  host.innerHTML = '<div class="gt-wrap' + (gtCanWrite() ? '' : ' gt-ro') + '" id="gt-wrap">' +
    '<div class="gt-inner" style="width:' + (LW + geo.totalW) + 'px">' + head +
    '<div class="gt-body">' + lines + body + '</div></div></div>';

  const wrap = document.getElementById('gt-wrap');
  if (mode === true) {
    wrap.scrollLeft = Math.max(0, gtX(geo, geo.firstItemDay) - 40);
  } else if (mode === 'left') {
    wrap.scrollLeft = 0; wrap.scrollTop = prevTop;
  } else {
    wrap.scrollLeft = prevLeft; wrap.scrollTop = prevTop;
  }
  gtBind(wrap);
}

function gtRowHtml(row, geo) {
  const g = 'gc-' + (gtHash(row.grupo) % GT_COLORS);
  const bars = row.items.map(it => {
    const d0 = gtDay(it.fechaInicio), d1 = gtDay(it.fechaFin);
    const bg = gtBarGeom(geo, d0, d1);
    if (bg.hidden) return '';
    return '<div class="gt-bar ' + g + (bg.clipL ? ' clip-l' : '') + (bg.clipR ? ' clip-r' : '') +
      '" data-id="' + UI.esc(it.ganttId) + '" style="left:' + bg.left + 'px;width:' + bg.width + 'px;top:' +
      Math.round(row.padTop + it._lane * (GT_BAR_H + GT_BAR_GAP)) + 'px" title="' +
      UI.esc(it.titulo + ' · ' + gtLong(it.fechaInicio) + ' → ' + gtLong(it.fechaFin)) + '">' +
      '<span class="h l" data-h="l"></span><span class="t">' + UI.esc(it.titulo) + '</span>' +
      '<span class="h r" data-h="r"></span></div>';
  }).join('');
  return '<div class="gt-row" style="height:' + row.height + 'px">' +
    '<div class="gt-rlabel" title="' + UI.esc(row.fila) + '"><span>' + UI.esc(row.fila) + '</span></div>' +
    '<div class="gt-lane" style="width:' + geo.totalW + 'px" data-grupo="' + UI.esc(row.grupo) +
      '" data-fila="' + UI.esc(row.fila) + '">' + bars + '</div></div>';
}

/* ───────────────────────────── Arrastre con el mouse ───────────────────── */

function gtBind(wrap) {
  if (!gtCanWrite()) return;
  wrap.querySelectorAll('.gt-bar').forEach(bar => bar.addEventListener('pointerdown', gtDown));
  wrap.querySelectorAll('.gt-lane').forEach(lane => lane.addEventListener('dblclick', gtLaneDblClick));
}

function gtDown(e) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const bar = e.currentTarget;
  const it = gtFind(bar.getAttribute('data-id'));
  if (!it || Gantt.drag) return;
  const h = e.target && e.target.getAttribute ? e.target.getAttribute('data-h') : null;
  const d0 = gtDay(it.fechaInicio), d1 = gtDay(it.fechaFin);
  Gantt.drag = {
    bar: bar, it: it, mode: h === 'l' ? 'l' : (h === 'r' ? 'r' : 'move'),
    x0: e.clientX, y0: e.clientY, d0: d0, d1: d1, nd0: d0, nd1: d1, moved: false, lane: null
  };
  if (bar.setPointerCapture && e.pointerId !== undefined) {
    try { bar.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
  }
  bar.addEventListener('pointermove', gtMove);
  bar.addEventListener('pointerup', gtUp);
  bar.addEventListener('pointercancel', gtCancel);
  e.preventDefault();
}

function gtMove(e) {
  const st = Gantt.drag, geo = Gantt.geo;
  if (!st) return;
  const dx = e.clientX - st.x0, dy = e.clientY - st.y0;
  if (!st.moved && Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
  if (!st.moved) { st.moved = true; st.bar.classList.add('dragging'); }

  const dd = Math.round(dx / geo.ppd);
  // Límites: el rango visible, ampliado por lo que la cajita ya ocupaba fuera de él.
  const lowDay = Math.min(geo.rs, st.d0), highDay = Math.max(geo.re - 1, st.d1);
  if (st.mode === 'move') {
    const len = st.d1 - st.d0;
    st.nd0 = Math.max(lowDay, Math.min(highDay - len, st.d0 + dd));
    st.nd1 = st.nd0 + len;
  } else if (st.mode === 'l') {
    st.nd0 = Math.max(lowDay, Math.min(st.d1, st.d0 + dd)); st.nd1 = st.d1;
  } else {
    st.nd1 = Math.min(highDay, Math.max(st.d0, st.d1 + dd)); st.nd0 = st.d0;
  }

  gtApplyBar(st.bar, geo, st.nd0, st.nd1);

  if (st.mode === 'move') {
    st.bar.style.transform = 'translateY(' + dy + 'px)';
    gtHighlightLane(st, e.clientY);
  }
  gtShowTip(e, gtShort(st.nd0) + ' → ' + gtShort(st.nd1) + ' · ' + (st.nd1 - st.nd0 + 1) + ' d');
}

/** Resalta la fila bajo el puntero; no depende de elementFromPoint (no existe en jsdom). */
function gtHighlightLane(st, clientY) {
  let found = null;
  document.querySelectorAll('#gt-wrap .gt-lane').forEach(l => {
    const r = l.getBoundingClientRect();
    if (clientY >= r.top && clientY < r.bottom) found = l;
    l.classList.remove('drop-target');
  });
  st.lane = found;
  if (found) found.classList.add('drop-target');
}

function gtShowTip(e, text) {
  if (!Gantt.tip) {
    Gantt.tip = document.createElement('div');
    Gantt.tip.className = 'gt-tip';
    document.body.appendChild(Gantt.tip);
  }
  Gantt.tip.textContent = text;
  Gantt.tip.style.left = (e.clientX + 14) + 'px';
  Gantt.tip.style.top = (e.clientY - 30) + 'px';
}

function gtEndDrag() {
  const st = Gantt.drag;
  if (st) {
    st.bar.removeEventListener('pointermove', gtMove);
    st.bar.removeEventListener('pointerup', gtUp);
    st.bar.removeEventListener('pointercancel', gtCancel);
    st.bar.classList.remove('dragging');
    st.bar.style.transform = '';
  }
  document.querySelectorAll('#gt-wrap .gt-lane.drop-target').forEach(l => l.classList.remove('drop-target'));
  if (Gantt.tip) { Gantt.tip.remove(); Gantt.tip = null; }
  Gantt.drag = null;
  return st;
}

function gtCancel() {
  const st = gtEndDrag();
  if (st && st.moved) gtRender(false);
}

function gtUp() {
  const st = gtEndDrag();
  if (!st) return;
  if (!st.moved) { gtOpenModal(st.it, {}); return; }   // un clic sin arrastre = editar

  const patch = {};
  if (st.nd0 !== st.d0 || st.nd1 !== st.d1) {
    patch.fechaInicio = gtIso(st.nd0);
    patch.fechaFin = gtIso(st.nd1);
  }
  if (st.mode === 'move' && st.lane) {
    const g = st.lane.getAttribute('data-grupo'), f = st.lane.getAttribute('data-fila');
    if (g !== st.it.grupo || f !== st.it.fila) { patch.grupo = g; patch.fila = f; }
  }
  if (!Object.keys(patch).length) { gtRender(false); return; }

  // Actualización optimista y persistencia.
  Object.keys(patch).forEach(k => { st.it[k] = patch[k]; });
  gtRender(false);
  App.rpc('updateGanttItem', st.it.ganttId, patch)
    .then(data => { Gantt.data = data; gtRender(false); })
    .catch(err => {
      App.handleError(err);
      gtLoad().catch(App.handleError);   // nunca dejar en pantalla algo que no está guardado
    });
}

/* ───────────────────────────── Rango de fechas ─────────────────────────── */

/** Dominio completo (todas las actividades y el plazo del proyecto) en días. */
function gtDomain() {
  const data = Gantt.data;
  let days = [];
  data.items.forEach(i => { days.push(gtDay(i.fechaInicio), gtDay(i.fechaFin)); });
  if (data.project) days.push(gtDay(data.project.fechaInicio), gtDay(data.project.fechaFin));
  days = days.filter(d => d !== null);
  if (!days.length) days = [gtToday()];
  const min = Math.min.apply(null, days), max = Math.max.apply(null, days);
  return { min: min, max: Math.max(max, min + 1) };
}

/** Ventana efectiva: la elegida (acotada al dominio) o el dominio completo. */
function gtWindow() {
  const dom = gtDomain(), w = Gantt.win;
  if (!w) return { from: dom.min, to: dom.max, dom: dom };
  const from = Math.max(dom.min, Math.min(w.from, dom.max - 1));
  const to = Math.min(dom.max, Math.max(w.to, from));
  return { from: from, to: to, dom: dom };
}

function gtSetWindow(from, to) {
  const dom = gtDomain();
  from = Math.max(dom.min, Math.min(from, dom.max));
  to = Math.max(from, Math.min(to, dom.max));
  Gantt.win = (from <= dom.min && to >= dom.max) ? null : { from: from, to: to };
}

function gtRenderRange() {
  const host = document.getElementById('gt-range');
  if (!host) return;
  if (!Gantt.data || !Gantt.data.items.length) { host.innerHTML = ''; return; }

  const w = gtWindow(), span = w.dom.max - w.dom.min, today = gtToday();
  const pct = d => ((d - w.dom.min) / span * 100).toFixed(3);

  let marks = '';
  Gantt.data.items.slice(0, 150).forEach(i => {
    const a = gtDay(i.fechaInicio), b = gtDay(i.fechaFin);
    if (a === null || b === null) return;
    marks += '<i class="gt-rmark" style="left:' + pct(a) + '%;width:' + Math.max(0.4, (b - a) / span * 100).toFixed(3) + '%"></i>';
  });

  host.innerHTML =
    '<div class="gt-range" title="Dominio completo: ' + UI.esc(gtLong(gtIso(w.dom.min)) + ' → ' + gtLong(gtIso(w.dom.max))) + '">' +
      '<span class="gt-rl" id="gt-r-from"></span>' +
      '<div class="gt-rtrack" id="gt-rtrack">' + marks +
        (today >= w.dom.min && today <= w.dom.max ? '<i class="gt-rtoday" style="left:' + pct(today) + '%"></i>' : '') +
        '<div class="gt-rwin" id="gt-rwin" title="Arrastra para desplazar el rango">' +
          '<span class="gt-rh l" data-rh="l" role="slider" tabindex="0" aria-label="Inicio del rango"></span>' +
          '<span class="gt-rh r" data-rh="r" role="slider" tabindex="0" aria-label="Fin del rango"></span>' +
        '</div>' +
      '</div>' +
      '<span class="gt-rl gt-rl-r" id="gt-r-to"></span>' +
      '<button class="btn btn-sm btn-ghost" id="gt-r-reset">Ver todo</button>' +
    '</div>';

  gtUpdateRange();
  const win = document.getElementById('gt-rwin');
  win.addEventListener('pointerdown', gtRangeDown);
  win.querySelectorAll('.gt-rh').forEach(h => h.addEventListener('keydown', gtRangeKey));
  document.getElementById('gt-r-reset').addEventListener('click', () => {
    Gantt.win = null;
    gtRenderRange();
    gtRenderBoard('left');
  });
}

/** Actualiza posición, etiquetas y botón sin reconstruir la barra (se usa mientras se arrastra). */
function gtUpdateRange() {
  const win = document.getElementById('gt-rwin');
  if (!win) return;
  const w = gtWindow(), span = w.dom.max - w.dom.min;
  win.style.left = ((w.from - w.dom.min) / span * 100) + '%';
  win.style.width = ((w.to - w.from) / span * 100) + '%';
  document.getElementById('gt-r-from').textContent = gtLong(gtIso(w.from));
  document.getElementById('gt-r-to').textContent = gtLong(gtIso(w.to));
  document.getElementById('gt-r-reset').disabled = !Gantt.win;
  win.querySelector('.gt-rh.l').setAttribute('aria-valuetext', gtLong(gtIso(w.from)));
  win.querySelector('.gt-rh.r').setAttribute('aria-valuetext', gtLong(gtIso(w.to)));
}

/** Re-dibuja el tablero a lo sumo una vez por cuadro mientras se arrastra la barra. */
function gtScheduleBoard() {
  if (Gantt.raf) return;
  const run = () => { Gantt.raf = null; gtRenderBoard('left'); };
  Gantt.raf = (window.requestAnimationFrame || (f => setTimeout(f, 16)))(run);
}

function gtRangeDown(e) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const el = e.currentTarget, h = e.target.getAttribute ? e.target.getAttribute('data-rh') : null;
  const w = gtWindow(), track = document.getElementById('gt-rtrack');
  Gantt.rdrag = {
    mode: h || 'pan', x0: e.clientX, from: w.from, to: w.to, dom: w.dom,
    tw: (track && track.getBoundingClientRect().width) || 1000
  };
  if (el.setPointerCapture && e.pointerId !== undefined) {
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
  }
  el.addEventListener('pointermove', gtRangeMove);
  el.addEventListener('pointerup', gtRangeUp);
  el.addEventListener('pointercancel', gtRangeUp);
  e.preventDefault();
}

function gtRangeMove(e) {
  const d = Gantt.rdrag;
  if (!d) return;
  const span = d.dom.max - d.dom.min;
  const dd = Math.round((e.clientX - d.x0) / d.tw * span);
  let from = d.from, to = d.to;
  if (d.mode === 'pan') {
    const len = to - from;
    from = Math.max(d.dom.min, Math.min(d.dom.max - len, from + dd));
    to = from + len;
  } else if (d.mode === 'l') {
    from = Math.max(d.dom.min, Math.min(to, from + dd));
  } else {
    to = Math.min(d.dom.max, Math.max(from, to + dd));
  }
  gtSetWindow(from, to);
  gtUpdateRange();
  gtScheduleBoard();
}

function gtRangeUp(e) {
  const el = e.currentTarget;
  el.removeEventListener('pointermove', gtRangeMove);
  el.removeEventListener('pointerup', gtRangeUp);
  el.removeEventListener('pointercancel', gtRangeUp);
  Gantt.rdrag = null;
  gtRenderRange();          // refleja el estado final (p. ej. "Ver todo" habilitado)
  gtRenderBoard('left');
}

/** Teclado: flechas mueven el borde 1 día (Mayús = 7 días). */
function gtRangeKey(e) {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const step = (e.key === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 7 : 1);
  const w = gtWindow(), side = e.currentTarget.getAttribute('data-rh');
  if (side === 'l') gtSetWindow(Math.min(w.from + step, w.to), w.to);
  else gtSetWindow(w.from, Math.max(w.to + step, w.from));
  e.preventDefault();
  gtUpdateRange();
  gtScheduleBoard();
}

/* ───────────────────────────── Filtro de acciones ──────────────────────── */

function gtOpenFilter(btn) {
  gtCloseFilter();
  const pop = document.createElement('div');
  pop.className = 'gt-pop';
  pop.id = 'gt-pop';
  document.body.appendChild(pop);
  Gantt.pop = pop;
  gtFillPop(pop);

  const r = btn.getBoundingClientRect();
  pop.style.top = (r.bottom + 6) + 'px';
  pop.style.right = Math.max(8, window.innerWidth - r.right) + 'px';

  pop.addEventListener('change', e => {
    const el = e.target;
    const g = el.getAttribute('data-g'), f = el.getAttribute('data-f');
    const rows = gtAllRows();
    if (f === null) {   // casilla de grupo: aplica a todas sus filas
      rows.filter(x => x.name === g).forEach(x => x.rows.forEach(r => {
        if (el.checked) delete Gantt.hidden[gtRowKey(r.grupo, r.fila)]; else Gantt.hidden[gtRowKey(r.grupo, r.fila)] = true;
      }));
    } else if (el.checked) delete Gantt.hidden[gtRowKey(g, f)];
    else Gantt.hidden[gtRowKey(g, f)] = true;
    gtPopApply(pop);
  });
  pop.addEventListener('click', e => {
    const b = e.target.closest ? e.target.closest('[data-all]') : null;
    if (!b) return;
    Gantt.hidden = {};
    if (b.getAttribute('data-all') === '0') {
      gtAllRows().forEach(g => g.rows.forEach(r => { Gantt.hidden[gtRowKey(r.grupo, r.fila)] = true; }));
    }
    gtPopApply(pop);
  });

  setTimeout(() => {
    document.addEventListener('mousedown', gtPopOutside, true);
    document.addEventListener('keydown', gtPopKey, true);
  }, 0);
}

function gtPopApply(pop) {
  gtSaveHidden();
  const body = pop.querySelector('.gt-pop-body');
  const top = body ? body.scrollTop : 0;
  gtRender(false);
  gtFillPop(pop);
  const nb = pop.querySelector('.gt-pop-body');
  if (nb) nb.scrollTop = top;
}

function gtFillPop(pop) {
  const groups = gtAllRows();
  let html = '<div class="gt-pop-head"><strong>Acciones visibles</strong><span>' +
    '<button class="btn btn-sm btn-ghost" data-all="1">Todas</button>' +
    '<button class="btn btn-sm btn-ghost" data-all="0">Ninguna</button></span></div><div class="gt-pop-body">';
  if (!groups.length) html += '<p style="margin:10px;color:var(--ink-muted)">Aún no hay acciones.</p>';
  groups.forEach(g => {
    html += '<label class="gt-pop-g"><input type="checkbox" data-g="' + UI.esc(g.name) + '"> ' + UI.esc(g.name) + '</label>';
    g.rows.forEach(r => {
      html += '<label class="gt-pop-r"><input type="checkbox" data-g="' + UI.esc(r.grupo) + '" data-f="' + UI.esc(r.fila) +
        '"' + (Gantt.hidden[gtRowKey(r.grupo, r.fila)] ? '' : ' checked') + '> <span>' + UI.esc(r.fila) + '</span>' +
        '<small>' + r.items.length + '</small></label>';
    });
  });
  pop.innerHTML = html + '</div>';

  // Estado de cada casilla de grupo: marcada, vacía o indeterminada.
  groups.forEach(g => {
    const shown = g.rows.filter(r => !Gantt.hidden[gtRowKey(r.grupo, r.fila)]).length;
    pop.querySelectorAll('input[data-g]:not([data-f])').forEach(cb => {
      if (cb.getAttribute('data-g') !== g.name) return;
      cb.checked = shown === g.rows.length;
      cb.indeterminate = shown > 0 && shown < g.rows.length;
    });
  });
}

function gtPopOutside(e) {
  if (!Gantt.pop) return;
  if (Gantt.pop.contains(e.target) || (e.target.closest && e.target.closest('#gt-filter'))) return;
  gtCloseFilter();
}

function gtPopKey(e) { if (e.key === 'Escape') { e.stopPropagation(); gtCloseFilter(); } }

function gtCloseFilter() {
  if (Gantt.pop) { Gantt.pop.remove(); Gantt.pop = null; }
  document.removeEventListener('mousedown', gtPopOutside, true);
  document.removeEventListener('keydown', gtPopKey, true);
}

/* ───────────────────────────── Alta / edición ──────────────────────────── */

function gtLaneDblClick(e) {
  if (e.target.closest && e.target.closest('.gt-bar')) return;
  const geo = Gantt.geo, lane = e.currentTarget;
  const x = e.clientX - lane.getBoundingClientRect().left;
  const day = Math.max(geo.rs, Math.min(geo.re - 1, Math.floor(x / geo.ppd) + geo.rs));
  gtOpenModal(null, {
    grupo: lane.getAttribute('data-grupo'), fila: lane.getAttribute('data-fila'),
    fechaInicio: gtIso(day), fechaFin: gtIso(day + geo.sc.defLen - 1)
  });
}

function gtOpenModal(item, preset) {
  const it = item || {};
  const isEdit = !!item;
  const items = Gantt.data ? Gantt.data.items : [];
  const uniq = arr => arr.filter((v, i) => arr.indexOf(v) === i);

  const start = it.fechaInicio || preset.fechaInicio || gtIso(gtToday());
  const end = it.fechaFin || preset.fechaFin || gtIso(gtDay(start) + gtScaleDef(Gantt.scale).defLen - 1);

  const overlay = UI.openModal({
    title: isEdit ? 'Editar actividad' : 'Nueva actividad',
    subtitle: Gantt.data ? Gantt.data.project.nombre : '',
    body:
      '<label class="field"><span>Actividad *</span>' +
        '<input type="text" name="titulo" maxlength="200" value="' + UI.esc(it.titulo || '') + '" required></label>' +
      '<div class="grid-2">' +
        '<label class="field"><span>Grupo</span>' +
          '<input type="text" name="grupo" maxlength="80" list="gt-dl-g" placeholder="General" value="' +
            UI.esc(it.grupo || preset.grupo || '') + '"></label>' +
        '<label class="field"><span>Acción (fila)</span>' +
          '<input type="text" name="fila" maxlength="120" list="gt-dl-r" placeholder="Igual al título" value="' +
            UI.esc(it.fila || preset.fila || '') + '"></label>' +
      '</div>' +
      '<datalist id="gt-dl-g">' + uniq(items.map(i => i.grupo)).map(v => '<option value="' + UI.esc(v) + '">').join('') + '</datalist>' +
      '<datalist id="gt-dl-r">' + uniq(items.map(i => i.fila)).map(v => '<option value="' + UI.esc(v) + '">').join('') + '</datalist>' +
      '<div class="grid-2">' +
        '<label class="field" style="margin-bottom:0"><span>Inicio *</span>' +
          '<input type="date" name="fechaInicio" value="' + UI.esc(start) + '" required></label>' +
        '<label class="field" style="margin-bottom:0"><span>Término *</span>' +
          '<input type="date" name="fechaFin" value="' + UI.esc(end) + '" required></label>' +
      '</div>',
    footer:
      (isEdit ? '<button class="btn btn-danger" data-act="delete" style="margin-right:auto">Eliminar</button>' : '') +
      '<button class="btn" data-act="cancel">Cancelar</button>' +
      '<button class="btn btn-primary" data-act="save">' + (isEdit ? 'Guardar cambios' : 'Crear actividad') + '</button>',
    onMount: root => {
      root.querySelector('[data-act="cancel"]').addEventListener('click', () => UI.closeModal(overlay));

      root.querySelector('[data-act="save"]').addEventListener('click', ev => {
        const data = UI.readForm(root);
        if (!String(data.titulo || '').trim()) { UI.modalError(overlay, 'El título de la actividad es obligatorio.'); return; }
        if (!data.fechaInicio || !data.fechaFin) { UI.modalError(overlay, 'Indica la fecha de inicio y de término.'); return; }
        if (data.fechaFin < data.fechaInicio) { UI.modalError(overlay, 'El término no puede ser anterior al inicio.'); return; }
        UI.clearModalError(overlay);
        const done = UI.busy(ev.currentTarget);
        const call = isEdit
          ? App.rpc('updateGanttItem', it.ganttId, data)
          : App.rpc('createGanttItem', Object.assign({ projectId: Gantt.projectId }, data));
        call.then(res => {
          UI.closeModal(overlay);
          Gantt.data = res;
          const rowKey = gtRowKey(String(data.grupo || '').trim() || 'General',
            String(data.fila || '').trim() || String(data.titulo).trim());
          if (Gantt.hidden[rowKey]) { delete Gantt.hidden[rowKey]; gtSaveHidden(); }
          gtRender(false);
          UI.toast(isEdit ? 'Actividad actualizada.' : 'Actividad creada.', 'ok');
        }).catch(err => { done(); UI.modalError(overlay, err.message); });
      });

      const del = root.querySelector('[data-act="delete"]');
      if (del) del.addEventListener('click', () => {
        UI.confirmDialog('Eliminar actividad', 'Se quitará "' + it.titulo + '" de la carta Gantt.', 'Eliminar', true)
          .then(yes => {
            if (!yes) return;
            App.rpc('deleteGanttItem', it.ganttId).then(res => {
              UI.closeAllModals();
              Gantt.data = res;
              gtRender(false);
              UI.toast('Actividad eliminada.', 'ok');
            }).catch(App.handleError);
          });
      });
    }
  });
}
</script>
